name: Bump App Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Tipo de incremento de version (semver)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - run: flutter pub get

      - name: Bump version with cider
        id: bump
        run: |
          NEW_VERSION=$(dart run cider bump ${{ inputs.bump_type }} --bump-build)
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_VERSION%%+*}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Tag version
        run: |
          git tag "v${{ steps.bump.outputs.version_name }}"
          git push origin "v${{ steps.bump.outputs.version_name }}"
